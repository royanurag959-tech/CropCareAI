version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: cropcare_backend
    environment:
      - DATABASE_URL=sqlite:///./cropcare.db
      - SECRET_KEY=cropcare-production-secret-key-2026
      - DEMO_MODE=true
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/uploaded_scans
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cropcare_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
